# True color and terminal integration
set -ga terminal-overrides ",*-256color:Tc"
set -g focus-events on
set -g set-clipboard on

# Keep pane and window numbering consistent
set -g pane-base-index 1
set -g renumber-windows on

# Reload the Home Manager-generated configuration
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Catppuccin status modules
set -g status-position bottom
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-left-length 200
set -g status-right ""
